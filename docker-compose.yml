version: "3.8"

services:
  uavlogviewer-dev:
    build:
      context: .
      dockerfile: Dockerfile_Dev
    container_name: uavlogviewer-dev
    environment:
      VUE_APP_CESIUM_TOKEN: "${VUE_APP_CESIUM_TOKEN:-}"
      VUE_APP_AGENT_BASE_URL: "http://localhost:8787"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    working_dir: /usr/src/app
    command: npm run dev
    depends_on:
      - agent-dev

  agent-dev:
    build:
      context: ./agent
    container_name: agent-dev
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
    ports:
      - "8787:8787"
    volumes:
      - ./agent:/usr/src/app
    working_dir: /usr/src/app
    command: bash -lc "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8787 --reload"

volumes:
  node_modules:
